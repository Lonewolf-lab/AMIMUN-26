<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .committee-detail { max-width: 1000px; margin: 0 auto; padding: 100px 20px 60px; text-align: center; }

        .committee-detail h2 { color: var(--accent-color); font-weight: 500; }
        .committee-content { margin-top: 40px; background: white; border-radius: 10px; padding: 40px; box-shadow: 0 5px 25px rgba(0,0,0,.05); }

<body>
    <div class="committee-detail">
        <div class="committee-logo-large"><img src="../images/Logos/unoosa.svg" alt="UNOOSA Logo"></div>

        <div class="committee-content"><p>Committee details will be announced soon.</p><a href="../committees.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Committees</a></div>
